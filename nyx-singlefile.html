<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070910">
  <meta name="nyx-release" content="2026.08.03.10">
  <title>Nyx</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070910;
      color: #f4f6fb;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070910;
    }

    button,
    a { font: inherit; }

    .nyx-launcher {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 38%, rgba(147, 130, 245, 0.11), transparent 34rem),
        #070910;
    }

    .nyx-launcher::before {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(196, 202, 220, 0.12) 1px, transparent 1.2px);
      background-size: 28px 28px;
      opacity: 0.22;
      content: "";
      pointer-events: none;
    }

    .nyx-boot {
      position: relative;
      z-index: 1;
      display: grid;
      width: min(30rem, calc(100vw - 3rem));
      justify-items: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    .nyx-boot[hidden] {
      display: grid;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .nyx-mark {
      width: 3.25rem;
      height: 3.25rem;
      filter: drop-shadow(0 0 1.25rem rgba(147, 130, 245, 0.3));
      animation: nyx-float 2.8s ease-in-out infinite;
    }

    .nyx-title {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 650;
      letter-spacing: -0.025em;
    }

    .nyx-status {
      min-height: 1.25rem;
      margin: 0;
      color: #929aaa;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    .nyx-actions {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.625rem;
      margin-top: 0.35rem;
    }

    .nyx-boot.is-delayed .nyx-actions,
    .nyx-boot.is-offline .nyx-actions { display: flex; }

    .nyx-action {
      min-height: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 0.75rem;
      padding: 0.6rem 0.9rem;
      background: rgba(15, 20, 32, 0.88);
      color: #f4f6fb;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .nyx-action:hover {
      border-color: rgba(147, 130, 245, 0.42);
      background: rgba(24, 29, 45, 0.96);
      transform: translateY(-1px);
    }

    .nyx-action:active { transform: scale(0.98); }

    .nyx-action:focus-visible {
      outline: 3px solid rgba(147, 130, 245, 0.44);
      outline-offset: 2px;
    }

    #nyxApp {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #070910;
      opacity: 0;
      transition: opacity 180ms ease;
    }

    #nyxApp.is-ready { opacity: 1; }

    @keyframes nyx-float {
      50% { transform: translateY(-0.3rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="nyx-launcher">
    <section class="nyx-boot" id="nyxBoot" aria-live="polite">
      <svg class="nyx-mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="nyxMoon" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#d9d3ff"/>
            <stop offset="1" stop-color="#8b7bea"/>
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="27" fill="url(#nyxMoon)"/>
        <circle cx="44" cy="21" r="25" fill="#070910"/>
      </svg>
      <h1 class="nyx-title">Opening Nyx</h1>
      <p class="nyx-status" id="nyxStatus">Loading the latest Nyx release&hellip;</p>
      <div class="nyx-actions">
        <button class="nyx-action" id="nyxRetry" type="button">Try again</button>
        <a class="nyx-action" href="https://nyxlearning.netlify.app/?source=single-file" target="_blank" rel="noopener noreferrer">Open directly</a>
      </div>
    </section>

    <iframe
      id="nyxApp"
      title="Nyx"
      allow="autoplay; camera; clipboard-read; clipboard-write; display-capture; fullscreen; gamepad; geolocation; microphone; picture-in-picture; pointer-lock"
      allowfullscreen
      referrerpolicy="no-referrer"
    ></iframe>
  </main>

  <script>
    (() => {
      "use strict";

      const NYX_URL = "https://nyxlearning.netlify.app/";
      const NYX_RELEASE = "2026.08.03.10";
      const IS_LOCAL_FILE = window.location.protocol === "file:";
      const frame = document.getElementById("nyxApp");
      const boot = document.getElementById("nyxBoot");
      const status = document.getElementById("nyxStatus");
      const retry = document.getElementById("nyxRetry");
      let delayedTimer = 0;

      const latestNyxUrl = () => {
        const url = new URL(NYX_URL);
        url.searchParams.set("source", "single-file");
        url.searchParams.set("release", NYX_RELEASE);
        url.searchParams.set("fresh", Date.now().toString(36));
        return url.href;
      };

      const showWaitingState = () => {
        boot.hidden = false;
        boot.classList.remove("is-delayed", "is-offline");
        status.textContent = navigator.onLine
          ? "Loading the latest Nyx release…"
          : "You appear to be offline. Nyx needs an internet connection.";
        if (!navigator.onLine) boot.classList.add("is-offline");
      };

      const loadNyx = () => {
        clearTimeout(delayedTimer);
        frame.classList.remove("is-ready");
        showWaitingState();
        if (!navigator.onLine) {
          frame.removeAttribute("src");
          return;
        }
        if (IS_LOCAL_FILE) {
          status.textContent = "Opening Nyx securely in Chrome…";
          window.setTimeout(() => window.location.replace(latestNyxUrl()), 80);
          return;
        }
        frame.src = latestNyxUrl();
        delayedTimer = window.setTimeout(() => {
          if (frame.classList.contains("is-ready")) return;
          boot.classList.add("is-delayed");
          status.textContent = "Nyx is taking longer than expected to respond.";
        }, 12000);
      };

      frame.addEventListener("load", () => {
        clearTimeout(delayedTimer);
        frame.classList.add("is-ready");
        boot.hidden = true;
      });

      retry.addEventListener("click", loadNyx);
      window.addEventListener("online", loadNyx);
      window.addEventListener("offline", showWaitingState);

      loadNyx();
    })();
  </script>
</body>
</html>
